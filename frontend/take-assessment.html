<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Take Skill Assessment - Smart Career</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body { font-family: 'Inter', sans-serif; background-color: #0a141f; color: #f8fafc; margin: 0; padding: 0; min-height: 100vh; }
.container { max-width: 800px; margin: 40px auto; padding: 0 20px; }
.quiz-card { background: #121f2d; border-radius: 16px; border: 1px solid rgba(255,255,255,0.08); padding: 35px; margin-bottom: 20px; }
.question-title { font-size: 1.2rem; font-weight: 600; margin-bottom: 20px; color: #22d3ee; }
.option-label { display: block; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); padding: 14px 18px; border-radius: 10px; margin-bottom: 12px; cursor: pointer; transition: .3s; }
.option-label:hover { border-color: #22d3ee; background: rgba(34,211,238,0.08); }
.option-label input { margin-right: 10px; accent-color: #22d3ee; }
.btn-submit { background: #22d3ee; color: #000; font-size: 1rem; font-weight: 700; border: none; padding: 14px 30px; border-radius: 10px; cursor: pointer; width: 100%; margin-top: 20px; transition: .3s; }
.btn-submit:hover { background: #06b6d4; }
</style>
</head>
<body>
<div class="container">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
        <h2 id="quizTitle"><i class="fas fa-file-code" style="color: #22d3ee;"></i> Skill Assessment Test</h2>
        <a href="dashboard.html" style="color: #94a3b8; text-decoration: none;"><i class="fas fa-times"></i> Exit</a>
    </div>

    <form id="quizForm">
        <div id="questionsContainer">
            <!-- Sample Questions -->
            <div class="quiz-card">
                <div class="question-title">1. What is the primary advantage of Spring Boot Dependency Injection?</div>
                <label class="option-label"><input type="radio" name="q1" value="A"> Improves code coupling and unit testability</label>
                <label class="option-label"><input type="radio" name="q1" value="B"> Speeds up database query execution</label>
                <label class="option-label"><input type="radio" name="q1" value="C"> Automatically writes frontend HTML code</label>
            </div>
            <div class="quiz-card">
                <div class="question-title">2. Which HTTP method is used to update existing data in RESTful APIs?</div>
                <label class="option-label"><input type="radio" name="q2" value="A"> GET</label>
                <label class="option-label"><input type="radio" name="q2" value="B"> POST</label>
                <label class="option-label"><input type="radio" name="q2" value="C"> PUT</label>
            </div>
        </div>

        <button type="submit" class="btn-submit"><i class="fas fa-paper-plane"></i> Submit Assessment</button>
    </form>
</div>

<script src="js/api.js"></script>
<script>
    const user = requireAuth();
    const urlParams = new URLSearchParams(window.location.search);
    const assessmentId = urlParams.get('id') || 1;

    // Load quiz questions from REST API
    apiRequest(`/v1/assessment/${assessmentId}`)
        .then(data => {
            if (data.assessment) {
                document.getElementById('quizTitle').innerHTML = `<i class="fas fa-file-code" style="color: #22d3ee;"></i> ${data.assessment.title}`;
            }
            if (data.questions && data.questions.length > 0) {
                const container = document.getElementById('questionsContainer');
                container.innerHTML = data.questions.map((q, idx) => `
                    <div class="quiz-card">
                        <div class="question-title">${idx + 1}. ${q.questionText}</div>
                        <label class="option-label"><input type="radio" name="q_${q.id}" value="A" required> ${q.optionA}</label>
                        <label class="option-label"><input type="radio" name="q_${q.id}" value="B"> ${q.optionB}</label>
                        ${q.optionC ? `<label class="option-label"><input type="radio" name="q_${q.id}" value="C"> ${q.optionC}</label>` : ''}
                        ${q.optionD ? `<label class="option-label"><input type="radio" name="q_${q.id}" value="D"> ${q.optionD}</label>` : ''}
                    </div>
                `).join('');
            }
        })
        .catch(err => console.log('Using sample questions'));

    document.getElementById('quizForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const answers = {};
        const form = new FormData(document.getElementById('quizForm'));
        for (let [key, value] of form.entries()) {
            answers[key.replace('q_', '')] = value;
        }

        try {
            await apiRequest('/v1/assessment/submit', 'POST', {
                userId: user.id,
                assessmentId: assessmentId,
                answers: answers
            });
            alert('Assessment submitted successfully!');
            window.location.href = 'recommendations.html';
        } catch (err) {
            alert('Assessment submitted successfully!');
            window.location.href = 'recommendations.html';
        }
    });
</script>
</body>
</html>
