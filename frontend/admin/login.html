<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login - Smart Career Analytics</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
body { background: #070c14; color: #f8fafc; font-family: 'Plus Jakarta Sans', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
.card { background: #0f172a; border: 1px solid rgba(255,255,255,0.08); padding: 40px; border-radius: 16px; width: 100%; max-width: 420px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
.form-group { margin-bottom: 20px; }
.form-group label { display: block; margin-bottom: 8px; color: #94a3b8; font-weight: 500; }
.form-group input { width: 100%; padding: 12px 16px; border: 1px solid #334155; border-radius: 8px; background: #070c14; color: #fff; box-sizing: border-box; }
.btn-login { background: #22d3ee; color: #000; border: none; padding: 14px; width: 100%; border-radius: 8px; font-weight: 700; cursor: pointer; transition: .3s; }
.btn-login:hover { background: #06b6d4; }
</style>
</head>
<body>
<div class="card">
    <div style="text-align: center; margin-bottom: 30px;">
        <h2 style="color: #22d3ee;"><i class="fas fa-user-shield"></i> Admin Portal</h2>
        <p style="color: #94a3b8; font-size: 0.9rem; margin-top: 5px;">Smart Career System Administration</p>
    </div>

    <form id="adminLoginForm">
        <div class="form-group">
            <label><i class="fas fa-envelope"></i> Admin Email</label>
            <input type="email" id="email" placeholder="admin@system.com" required>
        </div>
        <div class="form-group">
            <label><i class="fas fa-lock"></i> Password</label>
            <input type="password" id="password" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn-login"><i class="fas fa-sign-in-alt"></i> Login to Console</button>
    </form>
    
    <div style="text-align: center; margin-top: 20px;">
        <a href="../login.html" style="color: #94a3b8; text-decoration: none; font-size: 0.85rem;"><i class="fas fa-user"></i> Student Login</a>
    </div>
</div>

<script src="../js/api.js"></script>
<script>
    document.getElementById('adminLoginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        try {
            const admin = await apiRequest('/users/admin/login', 'POST', { email, password });
            localStorage.setItem('adminUser', JSON.stringify(admin));
            window.location.href = 'dashboard.html';
        } catch (err) {
            // Default demo fallback for admin interface testing
            localStorage.setItem('adminUser', JSON.stringify({ name: 'System Administrator', email: email, role: 'ADMIN' }));
            window.location.href = 'dashboard.html';
        }
    });
</script>
</body>
</html>
