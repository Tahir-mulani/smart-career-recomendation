<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Login - Smart Career Recommendation</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    
    <style>
        :root {
            --primary-cyan: #22d3ee;
            --primary-hover: #06b6d4;
            --bg-dark-blue: #0a141f;
            --text-light: #f8fafc;
            --text-dark: #0f172a;
            --text-muted: #94a3b8;
            --card-bg-light: #ffffff;
            --danger: #ef4444;
            --success: #10b981;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f8fafc;
            color: var(--text-dark);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background: var(--bg-dark-blue);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding: 20px 0;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }

        .header-content {
            width: min(1200px, 90%);
            margin: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.7rem;
            font-weight: 700;
            color: var(--primary-cyan);
            text-decoration: none;
        }

        .logo span { color: #fff; }

        nav ul {
            list-style: none;
            display: flex;
            gap: 20px;
        }

        nav a {
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s;
        }

        nav a:hover { color: var(--primary-cyan); }

        .container-main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 50px 20px;
            background: radial-gradient(circle at center, #0f172a 0%, #0a141f 100%);
        }

        .form-container {
            background: var(--card-bg-light);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 450px;
        }

        .form-container h2 {
            margin-bottom: 25px;
            color: var(--text-dark);
            font-size: 1.6rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-container h2 i { color: var(--primary-hover); }

        .form-group { margin-bottom: 20px; }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            font-size: 0.95rem;
            color: var(--text-dark);
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 0.95rem;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary-hover);
            box-shadow: 0 0 0 3px rgba(34, 211, 238, 0.15);
        }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: var(--primary-cyan);
            color: #000;
            font-size: 1.05rem;
            font-weight: 600;
            cursor: pointer;
            transition: .3s;
            margin-top: 10px;
            box-shadow: 0 4px 15px rgba(34, 211, 238, 0.2);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .btn:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(34, 211, 238, 0.3);
        }

        .bottom-text {
            text-align: center;
            margin-top: 25px;
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .bottom-text a {
            color: var(--primary-hover);
            text-decoration: none;
            font-weight: 600;
        }

        .alert {
            padding: 14px 20px;
            border-radius: 8px;
            margin-bottom: 25px;
            font-weight: 500;
            font-size: 0.95rem;
            display: none;
        }

        .alert-error {
            background: rgba(239, 68, 68, 0.1);
            color: var(--danger);
            border-left: 4px solid var(--danger);
        }

        .alert-success {
            background: rgba(16, 185, 129, 0.1);
            color: var(--success);
            border-left: 4px solid var(--success);
        }

        footer {
            background: var(--bg-dark-blue);
            color: var(--text-muted);
            text-align: center;
            padding: 25px 20px;
            font-size: 0.9rem;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }
    </style>
</head>
<body>
    <header>
        <div class="header-content">
            <a href="index.html" class="logo">Smart<span>Career</span></a>
            <nav>
                <ul>
                    <li><a href="register.html">Register</a></li>
                    <li><a href="admin/login.html">Admin Login</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <div class="container-main">
        <div class="form-container">
            <h2><i class="fas fa-sign-in-alt"></i> User Login</h2>
            
            <div id="alertError" class="alert alert-error">
                <i class="fas fa-exclamation-circle"></i> <span id="errorMsg"></span>
            </div>
            
            <div id="alertSuccess" class="alert alert-success">
                <i class="fas fa-check-circle"></i> <span id="successMsg"></span>
            </div>
            
            <form id="loginForm">
                <div class="form-group">
                    <label for="email"><i class="fas fa-envelope"></i> Email Address</label>
                    <input type="email" id="email" name="email" placeholder="Enter your registered email" required>
                </div>
                
                <div class="form-group">
                    <label for="password"><i class="fas fa-lock"></i> Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter your password" required>
                </div>
                
                <button type="submit" class="btn">
                    <i class="fas fa-right-to-bracket"></i> Login
                </button>
            </form>
            
            <p class="bottom-text">
                Don't have an account? <a href="register.html">Register here</a>
            </p>
            <p class="bottom-text" style="margin-top: 10px;">
                <a href="admin/login.html" style="color: var(--text-muted); font-size: 0.85rem;"><i class="fas fa-user-shield"></i> Are you an Admin? Login here</a>
            </p>
        </div>
    </div>

    <footer>
        <div class="container">
            <p>&copy; 2026 Smart Career Recommendation System. All rights reserved.</p>
        </div>
    </footer>

    <script src="js/api.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const alertError = document.getElementById('alertError');
            const alertSuccess = document.getElementById('alertSuccess');
            alertError.style.display = 'none';
            alertSuccess.style.display = 'none';

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                const user = await apiRequest('/users/login', 'POST', { email, password });
                alertSuccess.style.display = 'block';
                document.getElementById('successMsg').innerText = 'Login successful! Redirecting...';
                
                setCurrentUser(user);
                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 800);
            } catch (err) {
                alertError.style.display = 'block';
                document.getElementById('errorMsg').innerText = err.message || 'Invalid credentials. Please try again.';
            }
        });
    </script>
</body>
</html>
