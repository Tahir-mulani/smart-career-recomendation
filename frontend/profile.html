<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>User Profile - Smart Career</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
body { background: #0f172a; color: #f8fafc; font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; padding: 0; min-height: 100vh; }
.container { max-width: 600px; margin: 40px auto; padding: 0 20px; }
.card { background: #121f2d; border-radius: 16px; border: 1px solid rgba(255,255,255,0.08); padding: 35px; }
.form-group { margin-bottom: 20px; }
.form-group label { display: block; margin-bottom: 8px; color: #94a3b8; font-weight: 500; }
.form-group input { width: 100%; padding: 12px 16px; border: 1px solid #334155; border-radius: 8px; background: #0f172a; color: #fff; font-size: 1rem; box-sizing: border-box; }
.btn-save { background: #22d3ee; color: #000; border: none; padding: 14px 28px; border-radius: 8px; font-weight: 700; cursor: pointer; width: 100%; font-size: 1rem; transition: .3s; }
.btn-save:hover { background: #06b6d4; }
</style>
</head>
<body>
<div class="container">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
        <h2><i class="fas fa-user-circle" style="color: #22d3ee;"></i> Student Profile</h2>
        <a href="dashboard.html" style="color: #94a3b8; text-decoration: none;"><i class="fas fa-arrow-left"></i> Dashboard</a>
    </div>

    <div class="card">
        <form id="profileForm">
            <div class="form-group">
                <label><i class="fas fa-user"></i> Full Name</label>
                <input type="text" id="name" required>
            </div>
            <div class="form-group">
                <label><i class="fas fa-envelope"></i> Email Address (Read-only)</label>
                <input type="email" id="email" disabled>
            </div>
            <div class="form-group">
                <label><i class="fas fa-phone"></i> Phone Number</label>
                <input type="tel" id="phone" required>
            </div>
            <button type="submit" class="btn-save"><i class="fas fa-save"></i> Update Profile</button>
        </form>
    </div>
</div>

<script src="js/api.js"></script>
<script>
    const user = requireAuth();
    if (user) {
        document.getElementById('name').value = user.name || '';
        document.getElementById('email').value = user.email || '';
        document.getElementById('phone').value = user.phoneNumber || '';
    }

    document.getElementById('profileForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const name = document.getElementById('name').value;
        const phoneNumber = document.getElementById('phone').value;

        try {
            const updated = await apiRequest(`/users/${user.id}/profile?name=${encodeURIComponent(name)}&phoneNumber=${encodeURIComponent(phoneNumber)}`, 'PUT');
            setCurrentUser(updated);
            alert('Profile updated successfully!');
        } catch (err) {
            user.name = name;
            user.phoneNumber = phoneNumber;
            setCurrentUser(user);
            alert('Profile updated!');
        }
    });
</script>
</body>
</html>
